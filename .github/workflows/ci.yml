name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  HUSKY: 0

jobs:
  # ── Secret scanning ─────────────────────────────────────────────────────────
  scan-secrets:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Lint, format & build ────────────────────────────────────────────────────
  lint-and-build:
    name: Lint, Format & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Compile TypeScript
        run: npm run compile
